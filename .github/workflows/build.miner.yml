name: Build Buffy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-desktop.txt nuitka zstandard pytest

    - name: Run Tests
      run: python -m pytest -q tests

    - name: Read Version
      id: ver
      shell: bash
      run: echo "version=$(python -c 'import buffy; print(buffy.__version__)')" >> "$GITHUB_OUTPUT"

    # Libraries rarely change, so reuse their compiled objects: only our own modules get rebuilt
    - name: Restore Nuitka Cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/nuitka-cache
        key: nuitka-${{ hashFiles('requirements-desktop.txt') }}-${{ github.run_id }}
        restore-keys: nuitka-${{ hashFiles('requirements-desktop.txt') }}-

    # Nuitka compiles to C instead of bundling the interpreter, which antivirus
    # heuristics flag far less often than PyInstaller-style packers.
    - name: Build Buffy (Nuitka)
      env:
        NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
      run: |
        python -m nuitka --standalone --assume-yes-for-downloads `
          --windows-console-mode=disable `
          --windows-icon-from-ico=buffy/assets/buffy.ico `
          --include-data-dir=buffy/ui=buffy/ui `
          --include-data-dir=buffy/assets=buffy/assets `
          --include-package=buffy --include-package=pystray `
          --include-package=curl_cffi --include-package-data=curl_cffi `
          --include-package=clr_loader --include-package-data=clr_loader `
          --include-package=pythonnet --include-package-data=pythonnet `
          --nofollow-import-to=tkinter `
          --company-name=Buffy --product-name=Buffy `
          --file-version=${{ steps.ver.outputs.version }} --product-version=${{ steps.ver.outputs.version }} `
          --file-description="Buffy - MangaBuff autopilot" `
          --output-filename=Buffy.exe --output-dir=build main.py

    - name: Build Installer and Portable Zip
      run: |
        if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
          choco install innosetup -y --no-progress
        }
        $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
        if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
        $dist = (Resolve-Path build\main.dist).Path
        & $iscc /Q "/DDistDir=$dist" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\buffy.iss
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Rename-Item build\main.dist Buffy
        Compress-Archive -Path build\Buffy -DestinationPath "dist\Buffy-${{ steps.ver.outputs.version }}-portable.zip"
        Get-ChildItem dist

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Buffy-${{ steps.ver.outputs.version }}
        path: dist/*

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/Buffy-Setup-*.exe,dist/Buffy-*-portable.zip"
        name: "Buffy ${{ github.ref_name }}"
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        generateReleaseNotes: true
        tag: ${{ github.ref_name }}
