# README badges for the latest version and the download count. Badge services query GitHub with shared
# tokens and show "no releases found" whenever GitHub's release list hiccups (it did on 22 Oct 2026).
# Here the numbers come from our own token and land as static JSON on the `badges` branch, which
# shields.io only reads (https://shields.io/badges/endpoint-badge).
name: README badges

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
    - name: Latest version and download count
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        repo="${{ github.repository }}"
        # Tags stay visible when the release list does not: the highest vX.Y.Z is the version
        version=$(gh api "repos/$repo/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
        mkdir -p out
        git clone -q --depth 1 -b badges "https://github.com/$repo.git" prev 2>/dev/null || true
        badge() { printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"8b5cf6"}\n' "$1" "$2"; }
        if [ -n "$version" ]; then badge version "$version" > out/version.json
        elif [ -f prev/version.json ]; then cp prev/version.json out/; fi
        # Downloads only grow: never publish less than before (GitHub may list nothing during an outage)
        total=$(python3 - "$repo" <<'PY'
        import json, os, sys, urllib.request
        repo, total, page, seen = sys.argv[1], 0, 1, 0
        while True:
            req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}",
                                         headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
            rows = json.load(urllib.request.urlopen(req))
            if not rows:
                break
            seen += len(rows)
            total += sum(a["download_count"] for r in rows for a in r["assets"])
            page += 1
        print(f"releases {seen}, downloads {total}", file=sys.stderr)
        print(total)
        PY
        )
        before=$(python3 -c "import json;print(json.load(open('prev/downloads.json'))['message'])" 2>/dev/null || echo 0)
        [ "$total" -lt "$before" ] && total=$before
        badge downloads "$total" > out/downloads.json
        cat out/*.json

    - name: Publish to the badges branch
      run: |
        cd out
        git init -q -b badges
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -q -m "Update README badges"
        git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
